[package]
name = "veloxfi-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["swagger"]
swagger = ["utoipa", "utoipa-swagger-ui"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
actix-web = "4.4"
log = "0.4"
env_logger = "0.11"
utoipa = { version = "5.4.0", features = ["actix_extras"], optional = true }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"], optional = true }
